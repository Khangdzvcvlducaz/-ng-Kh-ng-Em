<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Đóng không em? — Coffee & Singing</title>
<meta name="description" content="Sữa nóng mùa lạnh. Coffee & Singing — Đóng không em?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#B3282D;
    --cream:#F5EBDD;
    --gold:#D4A853;
    --dark:#3E2A1E;
  }
  *{margin:0;padding:0;box-sizing:border-box}

  /* Smooth scroll chỉ cho desktop — tránh xung đột momentum trên mobile */
  @media (hover:hover) and (pointer:fine){
    html{scroll-behavior:smooth}
  }
  body{
    font-family:'Be Vietnam Pro',sans-serif;
    background:var(--cream);color:var(--dark);
    -webkit-font-smoothing:antialiased;
    touch-action:pan-y;
  }

  /* ==== HERO SCROLL-DRIVEN — 260vh vừa đủ, đỡ mỏi tay ==== */
  .scrolly{height:260vh;position:relative}
  .stage{
    position:sticky;top:0;
    height:100svh;min-height:600px;
    overflow:hidden;background:#E9D3B3;
  }
  .stage video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center 42%;
  }
  .stage::after{
    content:"";position:absolute;inset:0 0 55% 0;pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(62,42,30,.42) 0%, rgba(62,42,30,.18) 55%, transparent 100%);
  }

  .overlay{
    position:absolute;left:0;right:0;
    padding:calc(env(safe-area-inset-top) + 64px) 24px 0;
    text-align:center;z-index:2;
    transition:opacity .4s ease, transform .4s ease;
  }
  .eyebrow{
    font-size:11px;letter-spacing:.34em;font-weight:600;
    color:var(--gold);text-transform:uppercase;
    text-shadow:0 1px 8px rgba(62,42,30,.5);
  }
  h1{
    font-family:'Playfair Display',serif;font-style:italic;
    font-weight:700;color:var(--cream);
    font-size:clamp(44px,13vw,64px);line-height:1.04;margin-top:10px;
    text-shadow:0 2px 18px rgba(62,42,30,.45);
  }

  .scroll-hint{
    position:absolute;bottom:28px;left:0;right:0;z-index:2;
    text-align:center;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(255,255,255,.92);
    text-shadow:0 1px 6px rgba(62,42,30,.5);
    animation:bob 1.6s ease-in-out infinite;
    transition:opacity .4s;
  }
  @keyframes bob{50%{transform:translateY(8px);opacity:.55}}

  .cta-ov{
    top:auto;bottom:calc(env(safe-area-inset-bottom) + 44px);
    padding:0 24px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    opacity:0;transform:translateY(16px);pointer-events:none;
  }
  .cta-ov.on{opacity:1;transform:none;pointer-events:auto}

  .cta-sub{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--dark);font-weight:600;
    text-shadow:0 1px 6px rgba(255,255,255,.6);
  }
  .cta{
    display:inline-block;background:var(--red);color:var(--cream);
    text-decoration:none;font-weight:600;font-size:16px;
    padding:16px 44px;border-radius:999px;
    box-shadow:0 10px 30px rgba(179,40,45,.35);
    transition:transform .2s;
  }
  .cta:active{transform:scale(.96)}

  /* ==== MENU ==== */
  .menu{padding:72px 24px 96px;text-align:center}
  .menu h2{
    font-family:'Playfair Display',serif;font-style:italic;
    font-size:34px;color:var(--red);margin-bottom:6px;
  }
  .menu p{
    font-size:14px;letter-spacing:.18em;text-transform:uppercase;
    color:#9a7b5f;margin-bottom:40px;
  }
  .drinks{display:grid;gap:14px;max-width:420px;margin:0 auto}
  .drink{
    display:flex;justify-content:space-between;align-items:center;
    background:#fff;border-radius:18px;padding:20px 22px;
    box-shadow:0 4px 18px rgba(62,42,30,.07);
  }
  .drink b{font-size:16px}
  .drink span{font-size:12px;color:#9a7b5f;display:block;margin-top:2px}
  .drink .price{font-weight:600;color:var(--red);font-size:17px;white-space:nowrap}

  @media (prefers-reduced-motion:reduce){
    .scrolly{height:auto}
    .stage{height:100svh;background:url('poster.png') center/cover no-repeat}
    .stage video{display:none}
    .scroll-hint{display:none}
    .cta-ov{opacity:1;transform:none;pointer-events:auto}
  }
</style>
</head>
<body>

<section class="scrolly" id="scrolly">
  <div class="stage">
    <video id="film" muted playsinline preload="auto" poster="poster.png">
      <source src="scroll.mp4" type="video/mp4">
    </video>

    <div class="overlay" id="ovHead">
      <p class="eyebrow">Sữa nóng mùa lạnh</p>
      <h1>Đóng<br>không em?</h1>
    </div>

    <div class="scroll-hint" id="hint">Cuộn để pha chế ⌄</div>

    <div class="overlay cta-ov" id="ovCTA">
      <span class="cta-sub">Coffee &amp; Singing • Mùa lễ hội</span>
      <a class="cta" href="#menu">Order ngay 🎄</a>
    </div>
  </div>
</section>

<section class="menu" id="menu">
  <h2>Menu mùa lạnh</h2>
  <p>Coffee &amp; Singing</p>
  <div class="drinks">
    <div class="drink">
      <div><b>Sữa nóng Đóng Không Em</b><span>Signature • hạt đậu nành rang</span></div>
      <div class="price">45k</div>
    </div>
    <div class="drink">
      <div><b>Bạc xỉu kem trứng</b><span>Ngọt béo ấm áp</span></div>
      <div class="price">42k</div>
    </div>
    <div class="drink">
      <div><b>Cacao nướng marshmallow</b><span>Cho ngày mưa giá</span></div>
      <div class="price">49k</div>
    </div>
  </div>
</section>

<script>
(function(){
  const film    = document.getElementById('film');
  const ovHead  = document.getElementById('ovHead');
  const ovCTA   = document.getElementById('ovCTA');
  const hint    = document.getElementById('hint');
  const scrolly = document.getElementById('scrolly');

  const HIDE_HEADLINE = 0.16;   // nắp sắp bật → headline ẩn
  const SHOW_CTA      = 0.86;   // vào khúc xoáy → CTA hiện
  const SEEK_STEP     = 0.05;   // skip seek khi lệch nhỏ
  const LERP          = 0.15;   // mượt — tăng 0.2 nếu muốn bám tay hơn

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  /* ===== 1. TẢI VIDEO VÀO RAM (không phụ thuộc mạng khi seek) ===== */
  fetch('scroll.mp4')
    .then(function(r){ if(!r.ok) throw 0; return r.blob(); })
    .then(function(b){
      film.src = URL.createObjectURL(b);
      film.load();
    })
    .catch(function(){ /* giữ <source> gốc làm fallback */ });

  film.pause();

  /* ===== 2. iOS unlock: 1 chạm đầu để video render frame ===== */
  const unlock = function(){
    film.play().then(function(){ film.pause(); }).catch(function(){});
  };
  document.addEventListener('touchstart', unlock, { once:true });
  document.addEventListener('click',      unlock, { once:true });

  /* ===== 3. Tiến độ cuộn ===== */
  let target = 0, current = 0, lastT = -1;

  function measure(){
    const total  = scrolly.offsetHeight - innerHeight;
    const passed = Math.min(Math.max(-scrolly.getBoundingClientRect().top, 0), total);
    target = total > 0 ? passed / total : 0;
  }
  addEventListener('scroll', measure, { passive:true });
  addEventListener('resize', measure);
  measure();

  /* ===== 4. Vòng lặp chính — FIX CHÍNH CHO iOS =====
     KHÔNG BAO GIỜ seek khi iOS đang seek dở (film.seeking).
     Seek cũ xong → frame mới rAF sẽ seek tiếp. Hết cảnh đứng hình. */
  let headOn = true, ctaOn = false;

  (function raf(){
    current += (target - current) * LERP;
    if (Math.abs(target - current) < 0.0005) current = target;

    const dur = film.duration;
    if (dur > 0 && film.readyState >= 2 && !film.seeking){
      const t = current * (dur - 0.1);
      const settled = Math.abs(target - current) < 0.002;   // đã ngừng cuộn
      // khi còn cuộn: chỉ seek nếu lệch đủ lớn; khi dừng: snap chính xác lần cuối
      if (Math.abs(t - lastT) > (settled ? 0.001 : SEEK_STEP)){
        try { film.currentTime = t; lastT = t; } catch(e){}
      }
    }

    /* Overlay — chỉ đụng DOM khi trạng thái đổi */
    const h = current < HIDE_HEADLINE;
    if (h !== headOn){
      headOn = h;
      ovHead.style.opacity   = h ? 1 : 0;
      ovHead.style.transform = h ? 'none' : 'translateY(-16px)';
    }
    const c = current > SHOW_CTA;
    if (c !== ctaOn){
      ctaOn = c;
      ovCTA.classList.toggle('on', c);
    }
    hint.style.opacity = current < 0.03 ? 1 : 0;

    requestAnimationFrame(raf);
  })();
})();
</script>
</body>
</html>
