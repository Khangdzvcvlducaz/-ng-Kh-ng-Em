<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Đóng không em? — Coffee & Singing</title>
<meta name="description" content="Sữa nóng mùa lạnh. Coffee & Singing — Đóng không em?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#B3282D;
    --cream:#F5EBDD;
    --gold:#D4A853;
    --dark:#3E2A1E;
  }
  *{margin:0;padding:0;box-sizing:border-box}

  /* Smooth scroll chỉ cho desktop — tránh xung đột momentum trên mobile */
  @media (hover:hover) and (pointer:fine){
    html{scroll-behavior:smooth}
  }
  body{
    font-family:'Be Vietnam Pro',sans-serif;
    background:var(--cream);color:var(--dark);
    -webkit-font-smoothing:antialiased;
    touch-action:pan-y;
  }

  /* ==== HERO SCROLL-DRIVEN — 260vh vừa đủ, đỡ mỏi tay ==== */
  .scrolly{height:260vh;position:relative}
  .stage{
    position:sticky;top:0;
    height:100svh;min-height:600px;
    overflow:hidden;background:#E9D3B3;
    /* Hardware acceleration cho iOS */
    -webkit-transform:translate3d(0,0,0);
    transform:translate3d(0,0,0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    -webkit-perspective:1000px;
    perspective:1000px;
  }
  .stage video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center 42%;
    /* Force GPU rendering */
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    will-change:transform;
  }
